name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q AirPoint-Chever3d.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: src/AirPoint
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Rename APK
        run: cp src/AirPoint/app/build/outputs/apk/debug/app-debug.apk AirPoint-Chever3d.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AirPoint-Chever3d-apk
          path: AirPoint-Chever3d.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AirPoint build ${{ github.run_number }}
          files: AirPoint-Chever3d.apk
          make_latest: true
